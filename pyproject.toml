[project]
name = "browser-agent"
version = "0.1.0"
description = "An asynchronous Chromium browser agent driven by any model via OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.0",
    "nodriver==0.50.3",
    "openai>=3.16.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Collaborative annotation server for error analysis (browser_agent/evals/annotate).
# Kept out of the core agent's dependencies: `uv sync --extra annotate`.
annotate = [
    "alembic>=1.13",
    "boto3>=1.34",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "browser-agent[annotate]",
    "pyright>=1.1.405",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13.1",
]
analysis = [
    "pyyaml>=6.0",
]

[project.scripts]
browser-agent = "browser_agent.cli:main"
browser-agent-annotate = "browser_agent.evals.annotate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_agent"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
    "browser_agent/agent.py",
    "browser_agent/cli.py",
    "browser_agent/browser/interface.py",
    "browser_agent/browser/models.py",
    "browser_agent/browser/nodriver_runtime.py",
    "browser_agent/browser/nodriver_dom.py",
    "browser_agent/browser/nodriver_frames.py",
    "browser_agent/browser/nodriver_semantics.py",
    "browser_agent/browser/nodriver_session.py",
    "browser_agent/browser/runtime.py",
    "browser_agent/browser/transport.py",
    "browser_agent/state/adapter.py",
    "browser_agent/state/artifacts.py",
    "browser_agent/state/checkpoints.py",
    "browser_agent/state/local.py",
    "browser_agent/state/models.py",
    "tests/fakes.py",
]
