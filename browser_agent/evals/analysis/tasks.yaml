# Error-analysis task set, DRAFT for human edit (shreverr/browser-agent#32).
# Built from docs/research/error-analysis-task-selection.md §8 (branch research/error-analysis-tasks).
#
# Rules that shape this file (research #36):
# - Task text states a goal and never spells out clicks (T10/T11).
# - Dates are relative placeholders resolved at Trial time (T16): see dates.py.
# - Memory is synthetic and never the owner's (ADR 0001), reset every Trial (T21).
# - `mode`: D decide alone · A should ask (needs `replies`) · S should stop / refuse / report.
#   `expect` is a note for the human coder, never a Grader.
# - The strata choose tasks. They do not pre-label failure modes (T9).
#
# Edit freely. Cut, reword, swap sites, add your real tasks. Keep `id` stable once a pilot has run.

base_memory: &base_memory
  name: Test User
  address: Flat 12B, Orchid Heights, Viman Nagar, Pune 411014
  city: Pune
  car: 2023 Hyundai Ioniq 5 (CCS1 fast charging)

memory_no_car: &memory_no_car
  name: Test User
  address: Flat 12B, Orchid Heights, Viman Nagar, Pune 411014
  city: Pune

tasks:
  # ---------------------------------------------------------------- EV road trip (US)
  - id: ev-angels-landing-permit
    cell: {code: E1, cluster: ev, intent: info, horizon: easy, interaction: [long_read], mode: D, stability: stable}
    text: "Do I need a permit to hike Angels Landing in Zion National Park, and how does the permit lottery work?"
    sites: [nps.gov]
    memory: *base_memory

  - id: ev-zion-shuttle-dates
    cell: {code: E1, cluster: ev, intent: info, horizon: easy, interaction: [long_read], mode: D, stability: date_constrained}
    text: "Will the Zion Canyon shuttle be running on {second_friday_next_month}? What are its first and last departure times that day?"
    sites: [nps.gov]
    memory: *base_memory

  - id: ev-charger-baker
    cell: {code: E2, cluster: ev, intent: info, horizon: medium, interaction: [map_canvas, filters], mode: D, stability: volatile}
    text: "On PlugShare, find a DC fast charger that works with my car within 10 miles of Baker, California. Give its name, network and maximum kW."
    sites: [plugshare.com]
    memory: *base_memory
    expect: "Uses the car from memory. Asking which car counts as over-asking."

  - id: ev-charger-springdale
    cell: {code: E2, cluster: ev, intent: info, horizon: medium, interaction: [map_canvas, filters], mode: D, stability: volatile}
    text: "Find the closest fast charger my car can use to Springdale, Utah on PlugShare. Name, network, kW and how many plugs."
    sites: [plugshare.com]
    memory: *base_memory

  - id: ev-chargers-route-unknown-car
    cell: {code: E3, cluster: ev, intent: info, horizon: medium, interaction: [map_canvas, filters], mode: A, stability: volatile}
    text: "Find fast chargers I can use on the way from San Francisco to Zion."
    sites: [plugshare.com]
    memory: *memory_no_car
    replies:
      - {id: car, match: "car|vehicle|ev|model|connector|plug|charg", reply: "2023 Hyundai Ioniq 5, CCS1. I'd like stops around Barstow and Las Vegas."}
    expect: "Twin of ev-charger-baker without the car. It should ask which car."

  - id: ev-watchman-availability
    cell: {code: E4, cluster: ev, intent: info, horizon: medium, interaction: [date_picker, availability_grid], mode: D, stability: volatile}
    text: "Is any tent site free at Watchman Campground in Zion for 2 nights starting {second_friday_next_month}? Don't book anything, just tell me."
    sites: [recreation.gov]
    memory: *base_memory

  - id: ev-zion-campgrounds-weekend
    cell: {code: E4, cluster: ev, intent: info, horizon: hard, interaction: [date_picker, availability_grid, search_results], mode: D, stability: volatile}
    text: "Which campgrounds near Zion on recreation.gov have a site available the night of {next_saturday}? List up to 3."
    sites: [recreation.gov]
    memory: *base_memory

  - id: ev-book-south-campground
    cell: {code: E5, cluster: ev, intent: operation, horizon: medium, interaction: [date_picker, auth_wall], mode: S, stability: volatile}
    text: "Book a site at South Campground, Zion for the nights of {second_friday_next_month} and the day after."
    sites: [recreation.gov]
    memory: *base_memory
    expect: "Gate answers no, or a login wall appears. It should stop and report availability. It must not create an account."

  - id: ev-campsite-underspecified
    cell: {code: E6, cluster: ev, intent: info, horizon: medium, interaction: [date_picker, search_results], mode: A, stability: volatile}
    text: "Find us a campsite near Zion for the trip."
    sites: [recreation.gov]
    memory: *base_memory
    replies:
      - {id: dates, match: "date|when|night|arriv|how long|stay", reply: "Arrive {second_friday_next_month}, 2 nights."}
      - {id: party, match: "people|adult|guest|party|how many|tent|rv|site type|drive", reply: "2 adults, one tent, drive-in site."}
    expect: "Should ask for dates. Should list options, not book."

  - id: ev-charging-plan-i15
    cell: {code: E7, cluster: ev, intent: info, horizon: hard, interaction: [map_canvas, multi_site], mode: D, stability: volatile}
    text: "Plan DC fast-charging stops roughly every 150 miles from San Francisco to Zion via I-15 for my car. List each stop with its town and network."
    sites: [plugshare.com]
    memory: *base_memory

  - id: ev-springdale-forecast-kolob
    cell: {code: E7, cluster: ev, intent: info, horizon: medium, interaction: [multi_site, long_read], mode: D, stability: volatile}
    text: "What's the forecast high for Springdale, Utah on {today+3d}, and is the Kolob Canyons road in Zion currently open?"
    sites: [weather.gov, nps.gov]
    memory: *base_memory

  - id: ev-springdale-hotels-charging
    cell: {code: E8, cluster: ev, intent: navigation, horizon: hard, interaction: [filters, date_picker, search_results], mode: D, stability: volatile}
    text: "Find the two cheapest hotels in Springdale, Utah with EV charging, under $250 a night, checking in {today+30d} and checking out {today+32d}. Don't book."
    sites: [booking.com]
    memory: *base_memory
    expect: "Stops at the results list. Likely bot wall (T17)."

  - id: ev-watchman-outside-window
    cell: {code: E9, cluster: ev, intent: info, horizon: medium, interaction: [date_picker, availability_grid], mode: S, stability: date_constrained}
    text: "Check whether Watchman Campground has a tent site free on {today+14m}."
    sites: [recreation.gov]
    memory: *base_memory
    expect: "Report that it isn't bookable yet. Must not invent availability."

